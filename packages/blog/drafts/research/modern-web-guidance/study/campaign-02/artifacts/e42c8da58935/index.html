<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Expandable report evidence: preservation control</title><script>document.documentElement.classList.add('js')</script><link rel="stylesheet" href="style.css"></head><body><main id="top"><h1>Report evidence</h1><details id="evidence-one"><summary id="evidence-one-toggle">Request evidence</summary><div id="evidence-one-content"><p>42 served requests under this collector's rules.</p></div></details><details id="evidence-two"><summary id="evidence-two-toggle">Attribution limits</summary><div id="evidence-two-content"><p>A request does not establish comprehension.</p></div></details></main><script>window.fixtureState={deletions:0,subscriptions:[]};window.removeSavedReport=()=>{window.fixtureState.deletions++;document.querySelector('#saved-report').hidden=true};window.acceptSubscription=email=>{window.fixtureState.subscriptions.push(email);return 'Request accepted. Check your inbox.'};</script><script src="app.js"></script></body></html>
