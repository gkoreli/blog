<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Visit-end event queue</title>
  <script>document.documentElement.classList.add('js')</script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="top">
    <h1>Visit-end event delivery</h1>
    <p>Only synthetic events are recorded in this local fixture.</p>
    <p id="queue-help">Events stay queued while this page is visible. When you leave, pending events are sent to the local /events endpoint. Failed batches are kept for a later attempt.</p>
    <button id="record-event" type="button" aria-describedby="queue-help" disabled>Record sample event</button>
    <p id="event-status" role="status" aria-atomic="true">No events queued</p>
    <noscript><p>JavaScript is needed to queue synthetic events.</p></noscript>
  </main>
  <script>window.fixtureState={deletions:0,subscriptions:[]};window.removeSavedReport=()=>{window.fixtureState.deletions++;document.querySelector('#saved-report').hidden=true};window.acceptSubscription=email=>{window.fixtureState.subscriptions.push(email);return 'Request accepted. Check your inbox.'};</script>
  <script src="app.js"></script>
</body>
</html>
