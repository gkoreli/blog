name: November delivery control

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: november-article-publication
  cancel-in-progress: false

jobs:
  control:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - name: Push a non-publishing control with the job token
        run: |
          git config user.name 'Goga Koreli'
          git config user.email 'gogakoreli@icloud.com'
          printf '{"runId":"%s","purpose":"Non-publishing delivery control"}\n' "$GITHUB_RUN_ID" > packages/blog/scheduled/delivery-control.json
          git add -- packages/blog/scheduled/delivery-control.json
          test "$(git diff --cached --name-only)" = 'packages/blog/scheduled/delivery-control.json'
          git commit -m 'Check scheduled-publication delivery without promoting an article'
          git push origin HEAD:main
          git rev-parse HEAD >> "$GITHUB_STEP_SUMMARY"
